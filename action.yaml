# action.yml
name: "Update SPEC 0 dependencies"
description: "Update the lower bounds of Python dependencies covered by the Scientific Python SPEC 0 support schedule"
author: Scientific Python Developers
inputs:
  target_branch:
    description: "Target branch for the pull request"
    required: true
    default: "main"
  project_file_name:
    description: "Path to the project file listing dependencies, relative to repository root. Defaults to 'pyproject.toml'. Currently only pyproject.toml is supported."
    required: true
    default: "pyproject.toml"
  create_pr:
    description: "Whether the action should open a PR or not. Set to false for dry-run/testing."
    required: true
    default: "true"
  commit_msg:
    description: "Commit message for the commit to update the versions. by default 'Drop support for unsupported packages conform SPEC 0'. has no effect if `create_pr` is set to false"
    required: false
    default: "chore: Drop support for unsupported packages conform SPEC 0"
  pr_title:
    description: "The title of the PR that will be opened. by default 'Drop support for unsupported packages conform SPEC 0'. has no effect if `create_pr` is set to false"
    required: false
    default: "chore: Drop support for unsupported packages conform SPEC 0"
  pr_body:
    description: "The body of the PR that will be opened. Defaults to 'This automated PR updates the lower bounds of Python dependencies using the schedule defined in SPEC 0.'"
    required: false
    default: "This automated PR updates the lower bounds of Python dependencies using the schedule defined in SPEC 0."
  schedule_path:
    description: "Path to the schedule.json file relative to the project root. If not provided, the schedule bundled with the action is used."
    required: false
    default: ""
  token:
    description: "GitHub token with pull-requests write permission to create pull requests. Defaults to the built-in GITHUB_TOKEN."
    required: false
  update_all:
    description: "If set, update PEP dependencies without an applicable schedule floor or explicit core-package support period to versions first released within the last N years (e.g., 2)."
    required: false
    default: ""
  excluded_packages:
    description: "Comma- or whitespace-separated package names to leave unchanged, including with update_all. Use python to exclude Python requirements."
    required: false
    default: ""
  spec0_support_years:
    description: "If set, compute SPEC 0 core-package floors from PyPI using this many years of support (e.g., 3). Python still follows the supplied schedule; exclusions take precedence."
    required: false
    default: ""
  mode:
    description: "'update' (default) updates the lower bounds in the project file and can open a PR. 'constraints' only writes a constraints file with exact SPEC 0 minimum versions, to install and test the oldest supported versions in CI."
    required: false
    default: "update"
  packages:
    description: "constraints mode: comma- or whitespace-separated packages to pin, e.g. 'numpy scipy pandas'. Include python to get its minimum version in the outputs."
    required: false
    default: ""
  constraints_file:
    description: "constraints mode: path of the constraints file to write, relative to the workspace."
    required: false
    default: "constraints-spec0.txt"
  reference_date:
    description: "constraints mode: date (YYYY-MM-DD) to compute the floors for. Defaults to today."
    required: false
    default: ""
outputs:
  constraints_file:
    description: "constraints mode: path of the written constraints file."
    value: ${{ steps.constraints.outputs.constraints_file }}
  versions:
    description: "constraints mode: JSON mapping of package to minimum version."
    value: ${{ steps.constraints.outputs.versions }}
  python_version:
    description: "constraints mode: minimum Python version, if python was requested."
    value: ${{ steps.constraints.outputs.python_version }}
runs:
  using: "composite"
  steps:
    - name: Checkout code
      if: ${{ inputs.mode != 'constraints' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Git
      if: ${{ inputs.mode != 'constraints' }}
      shell: bash
      run: |
        git config user.name "Scientific Python [bot]"
        git config user.email "scientific-python@users.noreply.github.com"
    - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      name: Setup Pixi
      with:
        pixi-version: v0.69.0
        manifest-path: ${{ github.action_path }}/pyproject.toml
    - name: Fetch schedule from release
      if: ${{ inputs.schedule_path == '' }}
      uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
      with:
        repository: "scientific-python/spec0-action"
        latest: true
        fileName: "schedule.json"
    - name: Run update script
      if: ${{ inputs.mode != 'constraints' }}
      shell: bash
      env:
        PROJECT_FILE_NAME: ${{ inputs.project_file_name }}
        SCHEDULE_INPUT: ${{ inputs.schedule_path }}
        UPDATE_ALL: ${{ inputs.update_all }}
        SPEC0_SUPPORT_YEARS: ${{ inputs.spec0_support_years }}
        EXCLUDED_PACKAGES: ${{ inputs.excluded_packages }}
      run: |
        set -e
        if [ -n "$SCHEDULE_INPUT" ]; then
          SCHEDULE_PATH="${GITHUB_WORKSPACE}/${SCHEDULE_INPUT}"
        else
          SCHEDULE_PATH="${GITHUB_WORKSPACE}/schedule.json"
        fi
        echo "Updating ${PROJECT_FILE_NAME} using schedule ${SCHEDULE_PATH}"
        UPDATE_ARGS=()
        if [ -n "$UPDATE_ALL" ]; then
          UPDATE_ARGS+=(--update-all "$UPDATE_ALL")
        fi
        if [ -n "$SPEC0_SUPPORT_YEARS" ]; then
          UPDATE_ARGS+=(--spec0-support-years "$SPEC0_SUPPORT_YEARS")
        fi
        pixi run --manifest-path "${GITHUB_ACTION_PATH}/pyproject.toml" update-dependencies "${GITHUB_WORKSPACE}/${PROJECT_FILE_NAME}" "$SCHEDULE_PATH" --excluded-packages "$EXCLUDED_PACKAGES" "${UPDATE_ARGS[@]}"
    - name: Write constraints file
      if: ${{ inputs.mode == 'constraints' }}
      id: constraints
      shell: bash
      env:
        SCHEDULE_INPUT: ${{ inputs.schedule_path }}
        PACKAGES: ${{ inputs.packages }}
        CONSTRAINTS_FILE: ${{ inputs.constraints_file }}
        REFERENCE_DATE: ${{ inputs.reference_date }}
      run: |
        set -e
        if [ -n "$SCHEDULE_INPUT" ]; then
          SCHEDULE_PATH="${GITHUB_WORKSPACE}/${SCHEDULE_INPUT}"
        else
          SCHEDULE_PATH="${GITHUB_WORKSPACE}/schedule.json"
        fi
        ARGS=(--packages "$PACKAGES" --output "${GITHUB_WORKSPACE}/${CONSTRAINTS_FILE}")
        if [ -n "$REFERENCE_DATE" ]; then
          ARGS+=(--reference-date "$REFERENCE_DATE")
        fi
        pixi run --manifest-path "${GITHUB_ACTION_PATH}/pyproject.toml" write-constraints "$SCHEDULE_PATH" "${ARGS[@]}"
    - name: Changes
      if: ${{ inputs.mode != 'constraints' }}
      id: changes
      shell: bash
      env:
        PROJECT_FILE_NAME: ${{ inputs.project_file_name }}
      run: |
        echo "Showing changes that would be committed"
        git --no-pager diff -- "$PROJECT_FILE_NAME"
        if git diff --quiet -- "$PROJECT_FILE_NAME"; then
          echo "changes_detected=false" >> "$GITHUB_OUTPUT"
        else
          echo "changes_detected=true"  >> "$GITHUB_OUTPUT"
        fi
    - name: Create Pull Request
      if: ${{ inputs.mode != 'constraints' && fromJSON(inputs.create_pr) && fromJSON(steps.changes.outputs.changes_detected) }}
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ inputs.token || github.token }}
        commit-message: ${{ inputs.commit_msg }}
        title: ${{ inputs.pr_title }}
        body: ${{ inputs.pr_body }}
        base: ${{ inputs.target_branch }}
        branch: update-spec0-dependencies-${{ github.run_id }}
        add-paths: |
          ${{ inputs.project_file_name }}

branding:
  icon: "check-square"
  color: "blue"
