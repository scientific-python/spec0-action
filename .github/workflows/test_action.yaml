name: Test Action
on:
  push:
    branches:
      - "main"
      - "*.*"
    tags:
      - "v*"
  pull_request:
  # Allow manual runs through the web UI
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_data:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - excluded_packages: ""
            spec0_support_years: ""
          - excluded_packages: "numpy,\nscikit-learn"
            spec0_support_years: ""
          - excluded_packages: "ipython matplotlib networkx numpy pandas scikit-image scikit-learn scipy xarray zarr python"
            spec0_support_years: "3"
    name: "Run action with support years: '${{ matrix.spec0_support_years }}', exclusions: '${{ matrix.excluded_packages }}'"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate version data using local action
        uses: ./
        with:
          project_file_name: tests/test_data/pyproject.toml
          create_pr: false
          schedule_path: tests/test_data/test_schedule.json
          excluded_packages: ${{ matrix.excluded_packages }}
          spec0_support_years: ${{ matrix.spec0_support_years }}
      - name: Check dependency updates
        env:
          EXCLUDED_PACKAGES: ${{ matrix.excluded_packages }}
          SPEC0_SUPPORT_YEARS: ${{ matrix.spec0_support_years }}
        run: |
          if [ -n "$SPEC0_SUPPORT_YEARS" ]; then
            git diff --exit-code -- tests/test_data/pyproject.toml
            exit 0
          fi
          git diff -U0 -- tests/test_data/pyproject.toml > changes.diff
          grep -q '^+.*pandas' changes.diff
          if [ -n "$EXCLUDED_PACKAGES" ]; then
            if grep -Eq '^[-+].*(numpy|scikit-learn)' changes.diff; then exit 1; fi
          else
            grep -q '^+.*numpy' changes.diff
          fi

  constraints:
    runs-on: ubuntu-latest
    name: "Run action in constraints mode"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write constraints using local action
        id: spec0
        uses: ./
        with:
          mode: constraints
          packages: numpy scipy pandas python
          schedule_path: tests/test_data/test_schedule.json
          reference_date: "2025-04-01"
      - name: Check constraints file and outputs
        env:
          CONSTRAINTS_FILE: ${{ steps.spec0.outputs.constraints_file }}
          VERSIONS: ${{ steps.spec0.outputs.versions }}
          PYTHON_VERSION: ${{ steps.spec0.outputs.python_version }}
        run: |
          printf 'numpy==1.26.0\nscipy==1.12.0\npandas==2.1.0\n' > expected.txt
          diff expected.txt "$CONSTRAINTS_FILE"
          test "$PYTHON_VERSION" = "3.11"
          echo "$VERSIONS" | python -c 'import json, sys; assert json.load(sys.stdin)["numpy"] == "1.26.0"'
          git diff --exit-code
